services:
  api:
    image: openhousing-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      OPENHOUSING_MODEL_PATH: /app/models/model.pkl
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  etl:
    profiles: ["pipeline"]
    image: openhousing-development:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    command: python -m src.etl.pipeline --download-if-missing
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    security_opt:
      - no-new-privileges:true

  jupyter:
    profiles: ["dev"]
    image: openhousing-development:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/app
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-openhousing}
    security_opt:
      - no-new-privileges:true

  streamlit:
    profiles: ["ui"]
    image: openhousing-development:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    environment:
      OPENHOUSING_API_URL: ${OPENHOUSING_API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
